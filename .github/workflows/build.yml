name: Android Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🔥 关键修改：使用 JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      # 可选：如果仍有版本冲突，可指定旧版 cmdline-tools
      # env:
      #   CMDLINE_TOOLS_VERSION: "8.0"  # 兼容 JDK 11 的版本

    - name: Install NDK and CMake
      run: |
        # 使用 $ANDROID_SDK_ROOT 确保路径正确
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;21.1.6352462" "cmake;3.10.2.4988404"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        ./gradlew :ncnnAndroidPPOCR:assembleRelease
        ./gradlew :ncnndemo:assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: ncnndemo/build/outputs/apk/release/*.apk

    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: paddleocr4android-aar
        path: ncnnAndroidPPOCR/build/outputs/aar/*.aar
